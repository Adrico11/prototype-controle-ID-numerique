<html lang="fr">
<head>

<title>France Identité · Contrôle d'identité numérique (prototype)</title>
<style>
body{margin:0;background:#f6f6f6;color:#161616;font-family:Marianne,Arial,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.5}
*{box-sizing:border-box}h1,h2,h3,p,ol,ul{margin:0}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 32px;background:#fff;border-bottom:1px solid #ddd}
.sp{flex:1}
.logos{display:flex;align-items:center;gap:20px}.logos img{display:block}
.hb{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 14px;font:inherit;font-size:14px;font-weight:500;border:0;cursor:pointer;background:#fff;color:#000091;box-shadow:inset 0 0 0 1px #000091}.hb.act{background:#e8edff}
.metas{display:flex;flex-direction:column;font-size:14px;color:#3a3a3a;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;font-size:14px;font-weight:700;border-radius:16px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{background:#b8fec9;color:#18753c}.wa{background:#ffe9e6;color:#b34000}.er{background:#ffe9e9;color:#ce0500}.in{background:#e8edff;color:#0063cb}
.wrap{max-width:1160px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid #ddd;padding:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 24px;font:inherit;font-weight:500;border:0;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.p{background:#000091;color:#fff}.s{background:#fff;color:#000091;box-shadow:inset 0 0 0 1px #000091}.d{background:#ce0500;color:#fff}
.steps{display:flex;gap:8px;padding:0;list-style:none}
.steps li{flex:1;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border:1px solid #ddd;color:#666;font-size:14px}
.steps .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#e5e5e5;color:#3a3a3a;flex:none}
.steps .done .n{background:#18753c;color:#fff}.steps .cur{border-color:#000091;color:#161616;font-weight:700}.steps .cur .n{background:#000091;color:#fff}.steps .bad{border-color:#b34000;color:#161616;font-weight:700}.steps .bad .n{background:#b34000;color:#fff}
.row2{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.alert{display:flex;border:1px solid #0063cb;background:#fff}.alert .ia{width:48px;background:#0063cb;color:#fff;display:flex;justify-content:center;padding-top:16px;flex:none}.alert .tx{padding:16px 20px}
.alert.o{border-color:#b34000}.alert.o .ia{background:#b34000}
.res{display:flex;align-items:center;gap:16px;padding:20px 24px;color:#fff}.res h1{font-size:28px;line-height:1.2}
.res.g{background:#18753c}.res.r{background:#ce0500}.res.o{background:#b34000}
.f{padding:16px 0;border-top:1px solid #ddd}.f span{display:block;font-size:14px;color:#666}.f b{font-size:32px;line-height:1.3}
.v{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px;border-top:1px solid #ddd}.v svg{flex:none}
.chk{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid #ddd}
.chk .ic{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.chk b{display:block}.chk span.d2{font-size:14px;color:#3a3a3a}.chk .grow{flex:1}
.g{background:#18753c}.o{background:#b34000}.r{background:#ce0500}
.ph{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid #ddd}
.ph .c{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;font-weight:700}
.stat{padding:12px 16px;background:#f6f6f6}.stat b{display:block;font-size:28px;line-height:1.2}.stat span{font-size:14px;color:#3a3a3a}
.rd{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #ddd;cursor:pointer}
.rd i{width:20px;height:20px;border-radius:50%;border:2px solid #929292;flex:none}
.rd.on i{border-color:#000091;background:#000091;box-shadow:inset 0 0 0 4px #fff}
.ck{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px;border-top:1px solid #ddd;cursor:pointer}
.ck i{width:18px;height:18px;border:2px solid #929292;flex:none;display:flex;align-items:center;justify-content:center}
.ck.on i{background:#000091;border-color:#000091;color:#fff}
.mini{display:flex;gap:24px;flex-wrap:wrap;padding:16px 20px;background:#f6f6f6;margin-bottom:24px;align-items:center}.mini span{display:block;font-size:14px;color:#666}.mini b{font-size:18px}
.corner{position:absolute;width:44px;height:44px;border:0 solid #000091}
.kp{flex:1 1 180px;background:#fff;border:1px solid #ddd;padding:16px 20px}.kp span{display:block;font-size:14px;color:#666}.kp b{font-size:28px;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;background:#f6f6f6;padding:10px 12px;border-bottom:2px solid #000091;font-weight:700}
td{padding:10px 12px;border-bottom:1px solid #ddd}
.k{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #ddd}
.cs{padding:12px 0;border-top:1px solid #ddd;font-size:14px}
.dev{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:14px;border-top:1px solid #ddd}
.seg{display:flex;width:100%;max-width:460px}.seg>div,.seg>button{flex:1}
.seg .on{padding:12px 16px;background:#000091;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.muted{font-size:14px;color:#666}.txt2{font-size:14px;color:#3a3a3a}
.modal{position:fixed;inset:0;background:rgba(22,22,22,.64);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal>div{background:#fff;max-width:560px;width:100%;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#161616;color:#fff;padding:12px 20px;z-index:60;font-size:14px}
.demo{position:fixed;left:0;right:0;bottom:0;background:#161616;color:#fff;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;z-index:40}
.demo button{font:inherit;font-size:13px;padding:3px 10px;border:1px solid #929292;background:#161616;color:#fff;cursor:pointer}
.demo button:hover{background:#3a3a3a}
.spin{width:32px;height:32px;border-radius:50%;border:4px solid #e5e5e5;border-top-color:#000091;animation:spin .8s linear infinite;flex:none;box-sizing:border-box}@keyframes spin{to{transform:rotate(360deg)}}.pop .ic{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
video{display:block;width:100%;height:100%;object-fit:cover}
textarea{width:100%;font:inherit;padding:12px;border:0;border-bottom:2px solid #3a3a3a;background:#eee}
body.pad{padding-bottom:56px}
@media(max-width:900px){.steps{flex-wrap:wrap}}
